name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish windows/SnowFlakeUz.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/SnowFlakeUz.exe -DestinationPath SnowFlakeUz-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SnowFlakeUz-windows
          path: SnowFlakeUz-windows.zip

      - name: Attach to GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SnowFlakeUz-windows.zip
